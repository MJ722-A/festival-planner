<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>최적 동선 추천 & Firebase 공유</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3ffc43680242696881c377feba08bf5e"></script>
  <style>
    :root {
      --blue-50: #EFF6FF;
      --blue-100: #DBEAFE;
      --blue-200: #BFDBFE;
      --blue-500: #3B82F6;
      --blue-600: #2563EB;
      --blue-700: #1D4ED8;
      --text: #0F172A;
      --sub: #475569;
      --muted: #94A3B8;
      --line: #E2E8F0;
      --bg: #F4F7FD;
      --white: #FFFFFF;
      --green: #16A34A;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(37, 99, 235, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }

    .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .ic-sm { width: 14px; height: 14px; }
    .ic-lg { width: 22px; height: 22px; }

    .app { display: flex; flex-direction: column; height: 100dvh; }

    /* 헤더 */
    .header { background: var(--blue-600); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .back-btn { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .back-btn:hover { background: rgba(255,255,255,.3); }
    .header h1 { font-size: 18px; font-weight: 900; letter-spacing: -0.3px; }
    .header p { font-size: 12px; opacity: .85; margin-top: 1px; }

    /* 본문 */
    .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 460px 1fr; }
    .side { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid var(--line); }
    .map-pane { position: relative; min-height: 0; }
    #map { width: 100%; height: 100%; }
    .map-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 30px; background: var(--blue-50); font-size: 14px; line-height: 1.7; }

    .panel { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .panel-title .ic { color: var(--blue-600); }

    /* 공유 */
    .share-desc { font-size: 13px; color: var(--sub); margin-bottom: 12px; line-height: 1.5; }
    .btn-primary {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--blue-600); color: #fff; font-weight: 700; font-size: 15px; padding: 13px; border-radius: 12px;
      box-shadow: 0 4px 12px rgba(37,99,235,.3); transition: all .15s;
    }
    .btn-primary:hover { background: var(--blue-700); }
    .btn-primary:disabled { background: var(--blue-200); box-shadow: none; cursor: default; }
    .share-result { display: none; margin-top: 12px; gap: 8px; }
    .share-result.show { display: flex; }
    .share-input { flex: 1; min-width: 0; padding: 11px 12px; font-size: 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--sub); outline: none; }
    .btn-copy { padding: 0 16px; border-radius: 10px; background: var(--blue-50); color: var(--blue-600); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-copy:hover { background: var(--blue-100); }

    /* 이동수단 탭 */
    .mode-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
    .mode-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 9px; font-size: 12.5px; color: var(--sub); transition: all .15s; }
    .mode-tab.active { background: var(--white); color: var(--blue-600); font-weight: 700; box-shadow: 0 1px 4px rgba(15,23,42,.12); }
    .mode-desc { font-size: 13px; color: var(--sub); margin-bottom: 14px; line-height: 1.5; }

    /* 요약 통계 */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--blue-50); border-radius: 12px; padding: 12px 8px; text-align: center; }
    .stat b { display: block; font-size: 18px; font-weight: 900; color: var(--blue-600); }
    .stat span { font-size: 11.5px; color: var(--sub); }

    /* 타임라인 */
    .timeline { display: flex; flex-direction: column; }
    .stop { display: flex; gap: 12px; position: relative; }
    .stop-rail { display: flex; flex-direction: column; align-items: center; width: 30px; flex-shrink: 0; }
    .stop-num { width: 30px; height: 30px; border-radius: 50%; background: var(--blue-600); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(37,99,235,.35); flex-shrink: 0; }
    .stop-line { flex: 1; width: 2px; background: repeating-linear-gradient(to bottom, var(--blue-200) 0 5px, transparent 5px 9px); margin: 4px 0; }
    .stop:last-child .stop-line { display: none; }
    .stop-card { flex: 1; min-width: 0; background: var(--bg); border-radius: 12px; padding: 12px; display: flex; gap: 12px; cursor: pointer; border: 2px solid transparent; transition: border-color .15s; margin-bottom: 4px; }
    .stop-card:hover { border-color: var(--blue-200); }
    .stop-img { width: 62px; height: 62px; border-radius: 10px; background: linear-gradient(135deg, var(--blue-100), var(--blue-200)); color: var(--blue-600); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; flex-shrink: 0; }
    .stop-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .stop-info { min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
    .stop-tag { font-size: 11px; font-weight: 700; color: var(--blue-700); background: var(--blue-100); padding: 2px 7px; border-radius: 5px; align-self: flex-start; }
    .stop-title { font-size: 14.5px; font-weight: 700; line-height: 1.35; }
    .stop-addr { font-size: 12px; color: var(--sub); display: flex; gap: 5px; align-items: flex-start; }
    .stop-addr .ic { color: var(--muted); margin-top: 2px; }
    .leg { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--blue-600); font-weight: 500; padding: 4px 0 8px; }
    .leg-wrap { display: flex; gap: 12px; }
    .leg-wrap .rail { width: 30px; display: flex; justify-content: center; }
    .leg-wrap .rail i { width: 2px; background: repeating-linear-gradient(to bottom, var(--blue-200) 0 5px, transparent 5px 9px); }

    .empty-msg { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }

    /* 지도 오버레이 */
    .pin { width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--blue-600); border: 3px solid #fff; box-shadow: 0 3px 8px rgba(15,23,42,.35); display: flex; align-items: center; justify-content: center; }
    .pin span { transform: rotate(45deg); color: #fff; font-weight: 900; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; }
    .pin-label { margin-top: 6px; background: #fff; border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700; color: var(--text); box-shadow: 0 2px 6px rgba(15,23,42,.2); white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; }

    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: #0F172A; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 900px) {
      .header { padding: 12px 16px; }
      .header p { display: none; }
      .app { height: auto; min-height: 100dvh; }
      .main { grid-template-columns: 1fr; display: flex; flex-direction: column; }
      .map-pane { order: -1; height: 38vh; flex-shrink: 0; }
      .side { overflow: visible; border-right: none; padding: 16px; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-nav" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></symbol>
      <symbol id="i-festival" viewBox="0 0 24 24"><path d="M5.8 11.3 2 22l10.7-3.8"/><path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01"/><path d="m22 2-2.2.7a2.9 2.9 0 0 0-1.8 3.6l.1.3c.4 1.2.1 2.5-.8 3.4l-.3.3c-.9.9-2.2 1.2-3.4.8l-.3-.1a2.9 2.9 0 0 0-3.6 1.8L9 15"/><path d="M11 13 8 10"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4M4 13h4"/></symbol>
      <symbol id="i-bus" viewBox="0 0 24 24"><path d="M8 6v6M16 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="header">
      <button class="back-btn" id="backBtn" aria-label="축제 다시 선택하기"><svg class="ic ic-lg"><use href="#i-back"/></svg></button>
      <div>
        <h1>선택한 축제 최적 동선</h1>
        <p>가까운 순서로 방문 순서를 정리했어요</p>
      </div>
    </header>

    <div class="main">
      <aside class="side">
        <!-- 공유 -->
        <section class="panel">
          <div class="panel-title"><svg class="ic"><use href="#i-link"/></svg>친구에게 동선 공유하기</div>
          <p class="share-desc">일정을 저장하면 링크 하나로 친구도 같은 동선을 볼 수 있어요.</p>
          <button id="saveBtn" class="btn-primary"><svg class="ic"><use href="#i-link"/></svg>이 일정 저장 및 공유 링크 만들기</button>
          <div class="share-result" id="shareResult">
            <input type="text" id="shareUrl" class="share-input" readonly>
            <button class="btn-copy" id="copyBtn"><svg class="ic ic-sm"><use href="#i-copy"/></svg>복사</button>
          </div>
        </section>

        <!-- 요약 + 이동수단 -->
        <section class="panel">
          <div class="panel-title"><svg class="ic"><use href="#i-nav"/></svg>이동 방법 선택</div>
          <div class="mode-tabs" id="modeTabs"></div>
          <p class="mode-desc" id="modeDesc"></p>
          <div class="stats">
            <div class="stat"><b id="statCount">0곳</b><span>방문 축제</span></div>
            <div class="stat"><b id="statDist">0km</b><span>총 이동거리</span></div>
            <div class="stat"><b id="statTime">0분</b><span>예상 이동시간</span></div>
          </div>
        </section>

        <!-- 타임라인 -->
        <section class="panel">
          <div class="panel-title"><svg class="ic"><use href="#i-pin"/></svg>추천 방문 순서</div>
          <div class="timeline" id="timeline"></div>
        </section>
      </aside>

      <section class="map-pane">
        <div id="map"></div>
        <div class="map-fallback" id="mapFallback">지도를 불러오지 못했습니다.<br>카카오 개발자 센터의 JavaScript 키와 도메인 등록을 확인해 주세요.<br>(방문 순서 목록은 정상적으로 이용할 수 있습니다)</div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Firebase JS SDK v10 (ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase 구성 정보
    const firebaseConfig = {
      apiKey: "bKR6aY6qaYIQHlk4FmgpMzj5M9VegU6mNAng4z12",
      authDomain: "my-second-app-68acf.firebaseapp.com",
      databaseURL: "https://my-second-app-68acf-default-rtdb.firebaseio.com/",
      projectId: "my-second-app-68acf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const MODES = [
      { key: "walk",    icon: "i-walk", name: "도보",     speed: 4,  desc: "축제장 간의 정취를 즐기며 이동하는 동선" },
      { key: "transit", icon: "i-bus",  name: "대중교통", speed: 20, desc: "주변 대중교통 이용을 고려한 효율적 동선" },
      { key: "car",     icon: "i-car",  name: "자차/택시", speed: 40, desc: "이동 시간을 최대한 단축하는 최단 동선" }
    ];

    let festivals = [];
    let route = [];
    let legs = [];
    let totalDist = 0;
    let curMode = MODES[1];
    let map = null, polyline = null, overlays = [];

    const $ = id => document.getElementById(id);
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    let toastTimer;
    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function fmtTime(min) {
      if (min < 1) return "1분 미만";
      if (min < 60) return min + "분";
      const h = Math.floor(min / 60), m = min % 60;
      return m === 0 ? h + "시간" : h + "시간 " + m + "분";
    }
    function fmtDist(km) { return km < 10 ? km.toFixed(1) + "km" : Math.round(km) + "km"; }

    /* ---------- 시작 ---------- */
    window.addEventListener("DOMContentLoaded", async () => {
      $("backBtn").addEventListener("click", () => location.href = "index.html");
      $("saveBtn").addEventListener("click", saveScheduleToFirebase);
      $("copyBtn").addEventListener("click", copyShareUrl);
      buildModeTabs();

      // 지도 준비 (실패해도 목록은 보여줌)
      const mapReady = new Promise(resolve => {
        if (typeof kakao !== "undefined" && kakao.maps) {
          kakao.maps.load(() => {
            map = new kakao.maps.Map($("map"), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 8 });
            resolve();
          });
        } else {
          $("mapFallback").style.display = "flex";
          resolve();
        }
      });
      await mapReady;

      const urlParams = new URLSearchParams(window.location.search);
      const scheduleId = urlParams.get("id");

      if (scheduleId) {
        $("timeline").innerHTML = '<div class="empty-msg">공유된 동선을 불러오는 중...</div>';
        festivals = await loadScheduleFromFirebase(scheduleId);
        if (!festivals || festivals.length === 0) {
          alert("존재하지 않는 일정입니다.");
          location.href = "index.html";
          return;
        }
      } else {
        try { festivals = JSON.parse(localStorage.getItem("selectedFestivals") || "[]"); } catch (e) { festivals = []; }
        if (festivals.length === 0) {
          alert("선택된 축제가 없습니다.");
          location.href = "index.html";
          return;
        }
      }
      // Firebase는 배열을 객체로 돌려줄 수 있으므로 정리
      if (!Array.isArray(festivals)) festivals = Object.values(festivals);

      generateRoute();
    });

    /* ---------- Firebase ---------- */
    async function saveScheduleToFirebase() {
      if (festivals.length === 0) return;
      const saveBtn = $("saveBtn");
      saveBtn.disabled = true;
      saveBtn.innerHTML = "저장 중...";

      try {
        const optimized = calculateOptimizedOrder(festivals);
        const newRef = push(ref(db, "schedules"));
        await set(newRef, { createdAt: new Date().toISOString(), items: optimized });

        const shareUrl = `${window.location.origin}${window.location.pathname}?id=${newRef.key}`;
        $("shareUrl").value = shareUrl;
        $("shareResult").classList.add("show");
        saveBtn.innerHTML = '<svg class="ic"><use href="#i-check"/></svg>저장 완료!';
        toast("공유 링크가 만들어졌어요");
      } catch (err) {
        alert("저장 실패: " + err.message);
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<svg class="ic"><use href="#i-link"/></svg>이 일정 저장 및 공유 링크 만들기';
      }
    }

    async function loadScheduleFromFirebase(id) {
      try {
        const snapshot = await get(child(ref(db), `schedules/${id}`));
        return snapshot.exists() ? snapshot.val().items : null;
      } catch (err) { return null; }
    }

    async function copyShareUrl() {
      const input = $("shareUrl");
      input.select();
      try {
        await navigator.clipboard.writeText(input.value);
        toast("공유 링크가 클립보드에 복사되었어요");
      } catch (e) {
        document.execCommand("copy");
        toast("공유 링크가 복사되었어요");
      }
    }

    /* ---------- 경로 계산 ---------- */
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function calculateOptimizedOrder(items) {
      if (items.length <= 1) return items;
      let unvisited = [...items];
      let current = unvisited.shift();
      let result = [current];

      while (unvisited.length > 0) {
        let nearestIdx = 0, minDistance = Infinity;
        for (let i = 0; i < unvisited.length; i++) {
          let dist = getDistanceKm(current.mapy, current.mapx, unvisited[i].mapy, unvisited[i].mapx);
          if (dist < minDistance) { minDistance = dist; nearestIdx = i; }
        }
        current = unvisited.splice(nearestIdx, 1)[0];
        result.push(current);
      }
      return result;
    }

    function generateRoute() {
      route = calculateOptimizedOrder(festivals);
      legs = [];
      totalDist = 0;
      for (let i = 0; i < route.length - 1; i++) {
        const d = getDistanceKm(route[i].mapy, route[i].mapx, route[i + 1].mapy, route[i + 1].mapx);
        legs.push(d);
        totalDist += d;
      }
      drawMap();
      renderRoute();
    }

    /* ---------- 화면 렌더링 ---------- */
    function buildModeTabs() {
      $("modeTabs").innerHTML = MODES.map(m =>
        `<button class="mode-tab ${m.key === curMode.key ? "active" : ""}" data-key="${m.key}">
           <svg class="ic ic-lg"><use href="#${m.icon}"/></svg>${m.name}
         </button>`).join("");
      $("modeTabs").addEventListener("click", e => {
        const b = e.target.closest(".mode-tab"); if (!b) return;
        curMode = MODES.find(m => m.key === b.dataset.key);
        document.querySelectorAll(".mode-tab").forEach(t => t.classList.toggle("active", t === b));
        renderRoute();
      });
    }

    function renderRoute() {
      $("modeDesc").textContent = curMode.desc;
      const totalMin = Math.round((totalDist / curMode.speed) * 60);
      $("statCount").textContent = route.length + "곳";
      $("statDist").textContent = route.length > 1 ? fmtDist(totalDist) : "0km";
      $("statTime").textContent = route.length > 1 ? fmtTime(totalMin) : "-";

      const box = $("timeline");
      box.innerHTML = "";

      route.forEach((item, idx) => {
        const tag = idx === 0 ? "출발" : (idx === route.length - 1 ? "도착" : "경유");
        const stop = document.createElement("div");
        stop.className = "stop";
        const img = item.image ? `<img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.remove()">` : "";
        stop.innerHTML = `
          <div class="stop-rail"><div class="stop-num">${idx + 1}</div></div>
          <div class="stop-card">
            <div class="stop-img"><svg class="ic ic-lg"><use href="#i-festival"/></svg>${img}</div>
            <div class="stop-info">
              ${route.length > 1 ? `<span class="stop-tag">${tag}</span>` : ""}
              <div class="stop-title">${esc(item.title)}</div>
              <div class="stop-addr"><svg class="ic ic-sm"><use href="#i-pin"/></svg><span>${esc(item.addr || "주소 정보 없음")}</span></div>
            </div>
          </div>`;
        stop.querySelector(".stop-card").addEventListener("click", () => {
          if (map) map.panTo(new kakao.maps.LatLng(item.mapy, item.mapx));
        });
        box.appendChild(stop);

        // 다음 장소까지 이동 정보
        if (idx < legs.length) {
          const min = Math.round((legs[idx] / curMode.speed) * 60);
          const leg = document.createElement("div");
          leg.className = "leg-wrap";
          leg.innerHTML = `
            <div class="rail"><i></i></div>
            <div class="leg"><svg class="ic ic-sm"><use href="#${curMode.icon}"/></svg>${fmtDist(legs[idx])} · 약 ${fmtTime(min)}</div>`;
          box.appendChild(leg);
        }
      });
    }

    /* ---------- 지도 ---------- */
    function drawMap() {
      if (!map) return;
      overlays.forEach(o => o.setMap(null));
      overlays = [];
      const linePath = [];
      const bounds = new kakao.maps.LatLngBounds();

      route.forEach((item, idx) => {
        const loc = new kakao.maps.LatLng(item.mapy, item.mapx);
        linePath.push(loc);
        bounds.extend(loc);

        const ov = new kakao.maps.CustomOverlay({
          position: loc,
          yAnchor: 1.15,
          content: `<div style="display:flex;flex-direction:column;align-items:center">
                      <div class="pin"><span>${idx + 1}</span></div>
                      <div class="pin-label">${esc(item.title)}</div>
                    </div>`
        });
        ov.setMap(map);
        overlays.push(ov);
      });

      if (polyline) polyline.setMap(null);
      polyline = new kakao.maps.Polyline({
        path: linePath,
        strokeWeight: 5,
        strokeColor: "#2563EB",
        strokeOpacity: 0.85,
        strokeStyle: "solid"
      });
      polyline.setMap(map);
      map.setBounds(bounds);
      if (route.length === 1) map.setLevel(5);
    }
  </script>
</body>
</html>
