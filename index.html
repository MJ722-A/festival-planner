<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전국 축제 플래너 - 축제 탐색</title>
  <!-- Kakao Map API (발급받은 JavaScript 키로 대체) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=0e6f195fbc698aab2f359bd9bbb6a721"></script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; margin: 20px; }
    .container { display: flex; gap: 20px; }
    .left-panel { flex: 1; max-height: 80vh; overflow-y: auto; }
    .right-panel { flex: 1; }
    #map { width: 100%; height: 500px; border-radius: 8px; border: 1px solid #ccc; }
    .festival-card { border: 1px solid #e0e0e0; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
    .festival-card.selected { background-color: #e3f2fd; border-color: #2196f3; }
    .btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; }
    .btn-primary { background-color: #2196f3; color: white; }
  </style>
</head>
<body>
  <h1>🎡 11월/12월 축제 탐색하기</h1>
  
  <div style="margin-bottom: 20px;">
    <label>지역 선택: </label>
    <select id="areaSelect">
      <option value="">전국</option>
      <option value="1">서울</option>
      <option value="6">부산</option>
      <option value="31">경기</option>
      <option value="32">강원</option>
    </select>

    <label>월 선택: </label>
    <select id="monthSelect">
      <option value="20261101">11월</option>
      <option value="20261201">12월</option>
    </select>

    <button class="btn btn-primary" onclick="searchFestivals()">축제 검색</button>
  </div>

  <div class="container">
    <div class="left-panel">
      <h2>검색 결과 (<span id="count">0</span>개)</h2>
      <div id="festivalList"></div>
    </div>
    <div class="right-panel">
      <div id="map"></div>
    </div>
  </div>

  <hr style="margin-top: 20px;">
  <button class="btn btn-primary" onclick="goToPlanner()" style="padding: 12px 24px; font-size: 16px;">
    선택한 축제로 최적 동선 보기 ( <span id="cartCount">0</span>개 선택됨 )
  </button>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOTCh8U13nQe0uRRfRRSVDGt-JQv26uyl4VPmS3HyqOKiglcHAcLdvmvS-t-sXqz0/exec"; // GAS 웹앱 URL
    let selectedFestivals = [];
    let map, markers = [];

    window.onload = function() {
      const container = document.getElementById('map');
      const options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 8 };
      map = new kakao.maps.Map(container, options);
    };

    async function searchFestivals() {
      const area = document.getElementById("areaSelect").value;
      const month = document.getElementById("monthSelect").value;
      const listContainer = document.getElementById("festivalList");
      listContainer.innerHTML = "데이터 조회 중...";

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?areaCode=${area}&eventStartDate=${month}`);
        const data = await res.json();

        if (data.result === "ERROR") {
          alert("API 에러: " + data.message);
          return;
        }

        const items = data.response?.body?.items?.item || [];
        document.getElementById("count").innerText = items.length;
        listContainer.innerHTML = "";
        clearMarkers();

        const bounds = new kakao.maps.LatLngBounds();

        items.forEach(item => {
          if (!item.mapx || !item.mapy) return;

          const lat = parseFloat(item.mapy);
          const lng = parseFloat(item.mapx);
          const loc = new kakao.maps.LatLng(lat, lng);
          bounds.extend(loc);

          // 지도 마커 생성
          const marker = new kakao.maps.Marker({ position: loc, map: map, title: item.title });
          markers.push(marker);

          // 카드 생성
          const div = document.createElement("div");
          div.className = "festival-card";
          div.innerHTML = `
            <h3>${item.title}</h3>
            <p>기간: ${item.eventstartdate} ~ ${item.eventenddate}</p>
            <p>주소: ${item.addr1 || '주소 정보 없음'}</p>
            <button class="btn" onclick='toggleSelect(${JSON.stringify(item)}, this)'>일정에 담기</button>
          `;
          listContainer.appendChild(div);
        });

        if (items.length > 0) map.setBounds(bounds);

      } catch (err) {
        alert("데이터 로드 오류: " + err);
      }
    }

    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    function toggleSelect(item, btn) {
      const idx = selectedFestivals.findIndex(f => f.contentid === item.contentid);
      if (idx > -1) {
        selectedFestivals.splice(idx, 1);
        btn.innerText = "일정에 담기";
        btn.parentElement.classList.remove("selected");
      } else {
        selectedFestivals.push({
          id: item.contentid,
          title: item.title,
          addr: item.addr1,
          mapx: parseFloat(item.mapx),
          mapy: parseFloat(item.mapy)
        });
        btn.innerText = "담기 취소";
        btn.parentElement.classList.add("selected");
      }
      document.getElementById("cartCount").innerText = selectedFestivals.length;
    }

    function goToPlanner() {
      if (selectedFestivals.length === 0) {
        alert("최소 1개 이상의 축제를 선택해주세요!");
        return;
      }
      localStorage.setItem("selectedFestivals", JSON.stringify(selectedFestivals));
      location.href = "planner.html";
    }
  </script>
</body>
</html>
