<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전국 축제 플래너 - 축제 탐색</title>
  <!-- https: 명시 -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3ffc43680242696881c377feba08bf5e"></script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; margin: 20px; }
    .container { display: flex; gap: 20px; }
    .left-panel { flex: 1; max-height: 80vh; overflow-y: auto; }
    .right-panel { flex: 1; }
    #map { width: 100%; height: 500px; border-radius: 8px; border: 1px solid #ccc; }
    .festival-card { border: 1px solid #e0e0e0; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
    .festival-card.selected { background-color: #e3f2fd; border-color: #2196f3; }
    .btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; }
    .btn-primary { background-color: #2196f3; color: white; }
  </style>
</head>
<body>
  <h1>🎡 11월/12월 축제 탐색하기</h1>
  
  <div style="margin-bottom: 20px;">
    <label>지역 선택: </label>
    <select id="areaSelect">
      <option value="">전국</option>
      <option value="11">서울</option>
      <option value="26">부산</option>
      <option value="41">경기</option>
      <option value="51">강원</option>
    </select>


    <label>월 선택: </label>
    <select id="monthSelect">
      <option value="20261101">11월</option>
      <option value="20261201">12월</option>
    </select>

    <button class="btn btn-primary" onclick="searchFestivals()">축제 검색</button>
  </div>

  <div class="container">
    <div class="left-panel">
      <h2>검색 결과 (<span id="count">0</span>개)</h2>
      <div id="festivalList"></div>
    </div>
    <div class="right-panel">
      <div id="map"></div>
    </div>
  </div>

  <hr style="margin-top: 20px;">
  <button class="btn btn-primary" onclick="goToPlanner()" style="padding: 12px 24px; font-size: 16px;">
    선택한 축제로 최적 동선 보기 ( <span id="cartCount">0</span>개 선택됨 )
  </button>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOTCh8U13nQe0uRRfRRSVDGt-JQv26uyl4VPmS3HyqOKiglcHAcLdvmvS-t-sXqz0/exec";
    let selectedFestivals = [];
    let map, markers = [];

    // kakao.maps.load를 활용한 안전한 지도 초기화
    window.onload = function() {
      if (typeof kakao !== 'undefined' && kakao.maps) {
        kakao.maps.load(function() {
          const container = document.getElementById('map');
          const options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 8 };
          map = new kakao.maps.Map(container, options);
        });
      } else {
        alert("Kakao Map API를 불러오지 못했습니다. 카카오 개발자 센터에서 '도메인 실행 환경'에 GitHub Pages 주소를 등록했는지 확인해주세요.");
      }
    };

async function searchFestivals() {
  const area = document.getElementById("areaSelect").value;
  const month = document.getElementById("monthSelect").value;   // 예: 20261101
  const listContainer = document.getElementById("festivalList");
  listContainer.innerHTML = "데이터 조회 중...";

  try {
    // 선택한 월의 전월 1일 계산 (11월 선택 → 20261001)
    const y = parseInt(month.substring(0, 4));
    const m = parseInt(month.substring(4, 6));
    const d = new Date(y, m - 2, 1);
    const fromDate = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + "01";

    const res = await fetch(`${GAS_WEB_APP_URL}?areaCode=${area}&eventStartDate=${fromDate}`);
    const data = await res.json();
    console.log("API 응답:", data);

    // 오류 응답 처리
    if (data.result === "ERROR") {
      alert("서버 에러: " + data.message);
      listContainer.innerHTML = "";
      return;
    }
    if (data.resultCode && data.resultCode !== "0000") {
      alert("API 오류: " + data.resultCode + " / " + data.resultMsg);
      listContainer.innerHTML = "";
      return;
    }
    const hd = data.response && data.response.header;
    if (hd && hd.resultCode !== "0000") {
      alert("API 오류: " + hd.resultCode + " / " + hd.resultMsg);
      listContainer.innerHTML = "";
      return;
    }

    // 선택한 월에 열리는 축제만 거르기
    const monthStart = month;                        // 20261101
    const monthEnd = month.substring(0, 6) + "31";   // 20261131 (문자열 비교용)
    let items = (data.response?.body?.items?.item || []);
    if (!Array.isArray(items)) items = [items];      // 1건일 때 객체로 오는 경우 대비
    items = items.filter(i => i.eventenddate >= monthStart && i.eventstartdate <= monthEnd);

    document.getElementById("count").innerText = items.length;
    listContainer.innerHTML = "";
    clearMarkers();

    if (items.length === 0) {
      listContainer.innerHTML = "조회된 축제가 없습니다.";
      return;
    }

    const bounds = new kakao.maps.LatLngBounds();
    let markerCount = 0;

    items.forEach(item => {
      // 카드 생성 (좌표가 없어도 목록에는 표시)
      const div = document.createElement("div");
      div.className = "festival-card";

      const alreadySelected = selectedFestivals.some(f => f.contentid === item.contentid);
      if (alreadySelected) div.classList.add("selected");

      div.innerHTML = `
        <h3>${item.title}</h3>
        <p>기간: ${item.eventstartdate} ~ ${item.eventenddate}</p>
        <p>주소: ${item.addr1 || '주소 정보 없음'}</p>
      `;

      const btn = document.createElement("button");
      btn.className = "btn";
      btn.innerText = alreadySelected ? "담기 취소" : "일정에 담기";
      btn.addEventListener("click", () => toggleSelect(item, btn));
      div.appendChild(btn);
      listContainer.appendChild(div);

      // 지도 마커 생성 (좌표가 있을 때만)
      if (item.mapx && item.mapy) {
        const loc = new kakao.maps.LatLng(parseFloat(item.mapy), parseFloat(item.mapx));
        bounds.extend(loc);
        const marker = new kakao.maps.Marker({ position: loc, map: map, title: item.title });
        markers.push(marker);
        markerCount++;
      }
    });

    if (markerCount > 0 && map) map.setBounds(bounds);

  } catch (err) {
    alert("데이터 로드 오류: " + err);
  }
}


    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    function toggleSelect(item, btn) {
      const idx = selectedFestivals.findIndex(f => f.contentid === item.contentid);
      if (idx > -1) {
        selectedFestivals.splice(idx, 1);
        btn.innerText = "일정에 담기";
        btn.parentElement.classList.remove("selected");
      } else {
        selectedFestivals.push({
          contentid: item.contentid,
          title: item.title,
          addr: item.addr1,
          mapx: parseFloat(item.mapx),
          mapy: parseFloat(item.mapy)
        });
        btn.innerText = "담기 취소";
        btn.parentElement.classList.add("selected");
      }
      document.getElementById("cartCount").innerText = selectedFestivals.length;
    }

    function goToPlanner() {
      if (selectedFestivals.length === 0) {
        alert("최소 1개 이상의 축제를 선택해주세요!");
        return;
      }
      localStorage.setItem("selectedFestivals", JSON.stringify(selectedFestivals));
      location.href = "planner.html";
    }
  </script>
</body>
</html>
